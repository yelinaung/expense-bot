name: Hadolint

on:
  push:
    branches: [master, main]
    paths:
      - '**/Dockerfile'
      - '**/*.Dockerfile'
      - 'Dockerfile.*'
      - '.github/workflows/hadolint.yml'
  pull_request:
    branches: [master, main]
    paths:
      - '**/Dockerfile'
      - '**/*.Dockerfile'
      - 'Dockerfile.*'
      - '.github/workflows/hadolint.yml'
  workflow_dispatch: {}

jobs:
  hadolint:
    name: Lint Dockerfiles
    runs-on: [self-hosted, Linux, X64, playground-ubuntu]
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run hadolint for all Dockerfiles
        run: |
          set -euo pipefail

          mapfile -t dockerfiles < <(git ls-files \
            '**/Dockerfile' \
            '**/*.Dockerfile' \
            'Dockerfile.*')

          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "No Dockerfiles found."
            exit 0
          fi

          echo "Linting ${#dockerfiles[@]} Dockerfile(s)"
          for file in "${dockerfiles[@]}"; do
            echo "==> $file"
            docker run --rm -i hadolint/hadolint < "$file"
          done

  otel-cicd-action:
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: [self-hosted, Linux, X64, playground-ubuntu]
    permissions:
      contents: read
      actions: read
    needs: [hadolint]
    steps:
      - name: Export workflow
        uses: corentinmusard/otel-cicd-action@4826b79d63662fa91657272e7711420cb6aea543 # v4
        with:
          otlpEndpoint: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}/v1/traces
          otlpHeaders: ${{ secrets.OTEL_EXPORTER_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
